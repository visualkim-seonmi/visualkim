<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 회원가입 | 비주얼 클리닉</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#F6F1EA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23A8624E'/%3E%3Cpath d='M38 20 C 47 29 47 39 38 48' stroke='%23FAF6F2' stroke-width='5.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F1EA;--ink:#221E1B;--sub:#7C6F66;--rose:#A8624E;--rose-deep:#8F4E3C;--line:#E7DED3;--blush:#EFE7DB;--warn:#B4443A;--ok:#4A7C59;--serif:"Noto Serif KR",serif;--sans:"Pretendard",-apple-system,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:400px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(28px,7vw,40px) clamp(24px,6vw,32px)}
  .brand{text-align:center;font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.02em;margin-bottom:4px}
  .brand span{color:var(--rose)}
  .toggle{display:flex;background:var(--blush);border-radius:10px;padding:4px;margin:20px 0 22px}
  .toggle button{flex:1;padding:9px;border:none;background:transparent;border-radius:7px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:var(--sub)}
  .toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:5px}
  input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:var(--rose)}
  .field{margin-bottom:14px}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:8px;background:var(--rose);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;margin-top:4px}
  .btn:hover{background:var(--rose-deep)}
  .btn:disabled{background:#D8C7BF;cursor:not-allowed}
  .msg{padding:10px 13px;border-radius:8px;font-size:13px;margin-top:12px;word-break:keep-all}
  .msg.err{background:#F7E9E7;color:var(--warn)}.msg.ok{background:#E3F0E7;color:var(--ok)}
  .consent{font-size:12.5px;color:var(--sub);display:flex;gap:7px;align-items:flex-start;margin-top:2px}
  .consent input{width:auto;margin-top:3px}
  .foot{text-align:center;margin-top:18px;font-size:12.5px}
  .foot a{color:var(--sub);text-decoration:none}
  .hide{display:none!important}
</style>
</head>
<body>
  <main class="card">
    <p class="brand">VISUAL <span>CLINIC</span></p>
    <div class="toggle">
      <button id="tab-login" class="on">로그인</button>
      <button id="tab-signup">회원가입</button>
    </div>

    <!-- 로그인 -->
    <form id="form-login">
      <div class="field"><label>이메일</label><input type="email" id="l-email" autocomplete="username" required></div>
      <div class="field"><label>비밀번호</label><input type="password" id="l-pw" autocomplete="current-password" required></div>
      <button class="btn" type="submit">로그인</button>
    </form>

    <!-- 회원가입 -->
    <form id="form-signup" class="hide">
      <div class="field"><label>이름 / 닉네임</label><input type="text" id="s-name" placeholder="후기에 표시될 이름" autocomplete="name"></div>
      <div class="field"><label>이메일</label><input type="email" id="s-email" autocomplete="email" required></div>
      <div class="field"><label>비밀번호 (6자 이상)</label><input type="password" id="s-pw" autocomplete="new-password" minlength="6" required></div>
      <label class="consent"><input type="checkbox" id="s-agree"> <span>서비스 이용 및 개인정보 수집·이용에 동의합니다. (필수)</span></label>
      <button class="btn" type="submit" id="s-btn" disabled style="margin-top:14px">회원가입</button>
    </form>

    <div id="msg"></div>
    <p class="foot"><a href="https://visualkim.com/">← 홈으로 돌아가기</a></p>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const sb=window.supabase.createClient('https://urhmynpkknlwgxtqklcs.supabase.co','sb_publishable_eswMXufv1In3MlB7MYbjDA_DnNO4SOP');
  const $=s=>document.querySelector(s);
  const params=new URLSearchParams(location.search);
  const NEXT=params.get('next')||'/mypage/';
  function msg(m,e){$('#msg').innerHTML='<div class="msg '+(e?'err':'ok')+'">'+m+'</div>';}

  // 이미 로그인 상태면 마이페이지로
  sb.auth.getUser().then(({data:{user}})=>{ if(user) location.replace(NEXT); });

  // 탭 전환 (URL ?tab=signup 지원)
  function setTab(t){
    $('#tab-login').classList.toggle('on',t==='login');
    $('#tab-signup').classList.toggle('on',t==='signup');
    $('#form-login').classList.toggle('hide',t!=='login');
    $('#form-signup').classList.toggle('hide',t!=='signup');
    $('#msg').innerHTML='';
  }
  $('#tab-login').onclick=()=>setTab('login');
  $('#tab-signup').onclick=()=>setTab('signup');
  if(params.get('tab')==='signup') setTab('signup');

  $('#s-agree').onchange=function(){ $('#s-btn').disabled=!this.checked; };

  // 로그인
  $('#form-login').onsubmit=async(e)=>{
    e.preventDefault(); msg('로그인 중…',0);
    const {error}=await sb.auth.signInWithPassword({email:$('#l-email').value.trim(),password:$('#l-pw').value});
    if(error){ msg(error.message.includes('Invalid')?'이메일 또는 비밀번호가 올바르지 않아요.':error.message,1); return; }
    location.replace(NEXT);
  };

  // 회원가입
  $('#form-signup').onsubmit=async(e)=>{
    e.preventDefault();
    if(!$('#s-agree').checked){ msg('동의가 필요합니다.',1); return; }
    msg('가입 중…',0);
    const {data,error}=await sb.auth.signUp({
      email:$('#s-email').value.trim(), password:$('#s-pw').value,
      options:{ data:{ name:$('#s-name').value.trim() } }
    });
    if(error){ msg(error.message.includes('registered')?'이미 가입된 이메일이에요. 로그인해 주세요.':error.message,1); return; }
    if(data.session){ location.replace(NEXT); }          // 이메일 확인 off → 즉시 로그인
    else { msg('가입 완료! 확인 메일을 보냈어요. 메일의 링크를 눌러 인증한 뒤 로그인해 주세요. (스팸함도 확인)',0); setTab('login'); }
  };
})();
</script>
</body>
</html>
